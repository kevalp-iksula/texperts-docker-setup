################################################################################
# Nginx main configuration - Adobe Commerce 2.4.9 development
################################################################################

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                      'urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Magento admin pages and large product grids exceed the 1k default.
    client_header_buffer_size 4k;
    large_client_header_buffers 8 16k;

    # Must be >= PHP's upload_max_filesize, or Nginx rejects the upload before
    # PHP ever sees it. Kept in step with PHP_UPLOAD_MAX_FILESIZE in .env.
    client_max_body_size 128M;
    client_body_buffer_size 128k;

    # Magento's bootstrap can be slow on a cold cache or during setup:upgrade.
    fastcgi_connect_timeout 60s;
    fastcgi_send_timeout    600s;
    fastcgi_read_timeout    600s;
    fastcgi_buffer_size     128k;
    fastcgi_buffers         8 256k;
    fastcgi_busy_buffers_size 256k;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;

    gzip  on;
    gzip_disable "msie6";
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/xml;

    include /etc/nginx/upstream/*.conf;
    include /etc/nginx/conf.d/*.conf;
}
