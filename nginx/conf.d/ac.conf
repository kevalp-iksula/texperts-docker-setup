################################################################################
# Adobe Commerce 2.4.9 virtual host
#
# Self-contained on purpose. Magento's bundled nginx.conf.sample does not exist
# until Composer has run (Phase 3), and `include` of a missing file is a fatal
# config error — so relying on it would leave Nginx unable to start today.
################################################################################

server {
    listen 80 default_server;
    server_name _;

    set $MAGE_ROOT /var/www/magento;
    set $MAGE_MODE developer;

    root $MAGE_ROOT/pub;
    index index.php;
    autoindex off;
    charset UTF-8;

    # Liveness probe for the container healthcheck. Declared before anything
    # else so it answers even when Magento is absent or broken.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # FPM status/ping, reachable only from inside the Docker network.
    location ~ ^/-/fpm-(status|ping)$ {
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        fastcgi_pass fastcgi_backend;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
    }

    # Friendly message before Magento exists, instead of a bare 403/404.
    location = / {
        if (!-e $MAGE_ROOT/pub/index.php) {
            return 200 "Stack is up. Magento 2.4.9 is not installed yet - see docs/PHASE_3_PLAN.md\n";
        }
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location /pub/ {
        location ~ ^/pub/media/(downloadable|customer|import|custom_options|theme_customization/.*\.xml) {
            deny all;
        }
        alias $MAGE_ROOT/pub/;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /static/ {
        # In developer mode static files are generated on demand by the PHP
        # front controller. A miss must be rewritten to static.php WITH the
        # requested path passed as ?resource=... — a bare try_files to
        # /static.php sends no resource arg, so every asset 404s (unstyled page).
        location ~ ^/static/version\d*/ {
            rewrite ^/static/version\d*/(.*)$ /static/$1 last;
        }

        location ~* \.(ico|jpg|jpeg|png|gif|svg|svgz|webp|avif|js|css|eot|ttf|otf|woff|woff2|html|json|webmanifest)$ {
            add_header Cache-Control "max-age=31536000";
            add_header X-Frame-Options "SAMEORIGIN";
            expires +1y;
            if (!-f $request_filename) {
                rewrite ^/static/(.*)$ /static.php?resource=$1 last;
            }
        }

        location ~* \.(zip|gz|gzip|bz2|csv|xml)$ {
            add_header Cache-Control "no-store";
            add_header X-Frame-Options "SAMEORIGIN";
            expires off;
            if (!-f $request_filename) {
                rewrite ^/static/(.*)$ /static.php?resource=$1 last;
            }
        }

        if (!-f $request_filename) {
            rewrite ^/static/(.*)$ /static.php?resource=$1 last;
        }
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /media/ {
        try_files $uri $uri/ /get.php$is_args$args;

        location ~ ^/media/theme_customization/.*\.xml {
            deny all;
        }

        location ~* \.(ico|jpg|jpeg|png|gif|svg|svgz|webp|avif|js|css|eot|ttf|otf|woff|woff2)$ {
            add_header Cache-Control "max-age=31536000";
            add_header X-Frame-Options "SAMEORIGIN";
            try_files $uri $uri/ /get.php$is_args$args;
        }

        location ~* \.(zip|gz|gzip|bz2|csv|xml)$ {
            add_header Cache-Control "no-store";
            add_header X-Frame-Options "SAMEORIGIN";
            expires off;
            try_files $uri $uri/ /get.php$is_args$args;
        }

        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /media/customer/ { deny all; }
    location /media/downloadable/ { deny all; }
    location /media/import/ { deny all; }
    location /media/custom_options/ { deny all; }
    location /errors/ {
        location ~* \.xml$ { deny all; }
    }

    # Only these entry points may execute. Anything else ending in .php is
    # rejected, which is what stops uploaded-file execution in pub/media.
    location ~ ^/(index|get|static|errors/report|errors/404|errors/503|health_check)\.php$ {
        try_files $uri =404;
        fastcgi_pass fastcgi_backend;
        fastcgi_buffers 1024 4k;

        fastcgi_param PHP_FLAG "session.auto_start=off \n suhosin.session.cryptua=off";
        fastcgi_param PHP_VALUE "memory_limit=2G \n max_execution_time=600";
        fastcgi_read_timeout 600s;
        fastcgi_connect_timeout 60s;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param MAGE_MODE $MAGE_MODE;
        include fastcgi_params;
    }

    location ~* (\.php$|\.phtml$|\.htaccess$|\.htpasswd$|\.git) {
        deny all;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    gzip_static on;
}
