;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; PHP settings for Adobe Commerce 2.4.7 baseline (development)
;
; Identical to the 8.5 profile's ini — the values are version-agnostic and driven
; by ${VAR} from the environment. Comments MUST use ';'; PHP's ini parser does
; not treat '#' as a comment and will fail to parse the file.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[PHP]
memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
max_input_time = 300
max_input_vars = 10000
post_max_size = ${PHP_UPLOAD_MAX_FILESIZE}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}
realpath_cache_size = 10M
realpath_cache_ttl = 7200

; Development error visibility. Set PHP_DISPLAY_ERRORS=0 for a production-like run.
display_errors = ${PHP_DISPLAY_ERRORS}
display_startup_errors = ${PHP_DISPLAY_ERRORS}
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

date.timezone = ${TZ}

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 60000

; Magento's DI and annotations need docblock comments preserved; stripping
; them breaks code generation.
opcache.save_comments = 1

; validate_timestamps=1 is what makes live code reload work: PHP re-checks file
; mtimes on every request instead of serving a stale cache.
; Set PHP_OPCACHE_VALIDATE_TIMESTAMPS=0 to benchmark production-like speed.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 0

[mysqlnd]
mysqlnd.collect_statistics = Off

[soap]
soap.wsdl_cache_enabled = 0
