;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; PHP-FPM pool for Adobe Commerce 2.4.9 (development)
;
; Loaded after the stock www.conf, so these values win.
; Comments MUST use ';' — the FPM parser does not accept '#'.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[www]
user = www-data
group = www-data

; Nginx reaches FPM over the internal Docker network. This port is deliberately
; not published to the host in docker-compose.yml.
listen = 0.0.0.0:9000

; 'dynamic' suits a dev box: idle workers get reaped instead of holding RAM.
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle workers periodically. Guards against slow leaks over a long session.
pm.max_requests = 1000

; Magento's bootstrap is heavy; a 4s slowlog threshold catches genuinely stuck
; requests without spamming the log during normal page loads.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 4s
request_terminate_timeout = 300s

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

; Status/ping endpoints. Nginx keeps them internal-only.
pm.status_path = /-/fpm-status
ping.path = /-/fpm-ping

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
